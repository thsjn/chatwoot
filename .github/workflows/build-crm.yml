name: Build imagem CRM

# Publica a imagem propria em ghcr.io/thsjn/chatwoot.
# Espelha o publish_github_docker.yml do upstream, com duas diferencas:
#   - somente linux/amd64 (o VPS de producao e x86_64) -> build ~2x mais rapido
#   - NUNCA publica :latest -> a tag em producao e sempre explicita e pinada

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da imagem (ex: v4.16.2-fazer-ai.91-crm.0)"
        required: true
  push:
    tags:
      - "*-crm.*"

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Definir tag e versao
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REF="${{ inputs.tag }}"
          else
            REF="${GITHUB_REF_NAME}"
          fi
          echo "IMAGE_TAG=${REF}" >> $GITHUB_ENV
          echo "APP_VERSION=${REF#v}" >> $GITHUB_ENV

      # O upstream faz o mesmo strip no build. O diretorio enterprise/ existe no
      # repositorio (herdado do Chatwoot) mas esta sob licenca comercial e nao
      # pode ir para a imagem. Remover aqui mantem ChatwootApp.enterprise? = false.
      - name: Remover codigo enterprise
        run: |
          rm -rf enterprise
          rm -rf spec/enterprise

      - name: Gravar versao em config/app.yml
        run: |
          sed -i "s/version: '.*'/version: '${APP_VERSION}'/" config/app.yml
          head -3 config/app.yml

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resumo
        run: |
          echo "### Imagem publicada" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${IMAGE}:${IMAGE_TAG}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
