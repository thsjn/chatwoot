name: Testes CRM

# O workflow de specs do upstream (run_foss_spec.yml) roda em runners
# `blacksmith-*`, que sao self-hosted do fazer-ai e nao existem neste fork.
# Este workflow usa runners publicos e executa apenas os specs do modulo CRM,
# para dar feedback rapido. Como nao ha Ruby na maquina de desenvolvimento,
# ESTE E o ambiente de validacao do codigo backend.

on:
  push:
    branches: [crm]
    paths:
      # Qualquer caminho do modulo. Ja aconteceu duas vezes de um arquivo real
      # ficar fora desta lista e o CI passar sem executar nada: prefira o glob
      # largo a enumerar diretorio por diretorio.
      - "**/crm/**"
      - "app/models/concerns/crm/**"
      - "app/controllers/concerns/crm/**"
      - "app/listeners/crm_listener.rb"
      - "app/listeners/action_cable_listener.rb"
      - "app/javascript/dashboard/helper/actionCable.js"
      - "lib/events/types.rb"
      - "db/migrate/**"
      - "app/services/crm/**"
      - "app/jobs/crm/**"
      - "app/listeners/crm_listener.rb"
      - "spec/models/crm/**"
      - "spec/policies/crm/**"
      - "spec/requests/api/v1/accounts/crm/**"
      - "spec/services/crm/**"
      - "spec/jobs/crm/**"
      - "spec/listeners/crm_listener_spec.rb"
      - "spec/factories/crm_*"
      - "app/javascript/dashboard/store/crm/**"
      - "app/javascript/dashboard/api/crm/**"
      - "app/javascript/dashboard/routes/dashboard/crm/**"
      - "app/javascript/dashboard/i18n/locale/*/crm.json"
      - ".github/workflows/test-crm.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Roda os specs Vitest do modulo. Fica em job separado do backend porque nao
  # precisa de Postgres nem Redis: sobe em ~1 min contra os ~3 min do backend.
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm i

      - name: Specs do front do CRM
        run: |
          paths=()
          for dir in app/javascript/dashboard/store/crm \
                     app/javascript/dashboard/api/crm \
                     app/javascript/dashboard/routes/dashboard/crm; do
            if compgen -G "$dir/**/*.spec.js" > /dev/null; then
              paths+=("$dir")
            fi
          done
          if [ ${#paths[@]} -eq 0 ]; then
            echo "Nenhum spec de front do CRM ainda — nada a rodar."
          else
            TZ=UTC npx vitest run --no-coverage "${paths[@]}"
          fi
        shell: bash

  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ""
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: --entrypoint redis-server

    env:
      RAILS_ENV: test
      POSTGRES_HOST: localhost
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: ""
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependencias do front
        run: pnpm i

      # Mesmo strip do build: o diretorio esta sob licenca comercial.
      - name: Remover codigo enterprise
        run: |
          rm -rf enterprise
          rm -rf spec/enterprise

      - name: Preparar banco
        run: |
          bundle exec rake db:create
          bundle exec rake db:schema:load

      # Valida que as migrations do CRM aplicam sobre o schema do upstream.
      # Como nao ha Ruby local, o schema.rb nao e regenerado no desenvolvimento;
      # este passo e o que prova que as migrations sao validas.
      - name: Aplicar migrations do CRM
        run: bundle exec rake db:migrate

      - name: Specs do CRM
        run: |
          # Apenas os specs DO MODULO. `spec/listeners` inteiro traria specs do
          # upstream que falham por razoes alheias (ex: installation_config
          # duplicado) e derrubariam o CI do CRM sem nada nosso ter quebrado.
          paths=()
          for dir in spec/models/crm spec/policies/crm spec/requests/api/v1/accounts/crm \
                     spec/requests/public/api/v1/accounts/crm \
                     spec/services/crm spec/services/crm/reports spec/jobs/crm; do
            if compgen -G "$dir/*_spec.rb" > /dev/null; then
              paths+=("$dir")
            fi
          done
          # Os dois specs de listener do modulo, nomeados um a um pelo mesmo motivo.
          for file in spec/listeners/crm_listener_spec.rb \
                      spec/listeners/action_cable_listener_crm_spec.rb; do
            if [ -f "$file" ]; then
              paths+=("$file")
            fi
          done
          if [ ${#paths[@]} -eq 0 ]; then
            echo "Nenhum spec de CRM ainda — nada a rodar."
          else
            bundle exec rspec "${paths[@]}" --format progress
          fi
        shell: bash
